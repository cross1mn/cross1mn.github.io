<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Ex 01</title>
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="https://use.typekit.net/skh3nxe.css">
</head>
<body>
    <div>
        <h1>This is a Responsive Website!</h1>

        <p class="see">You are seeing this website with: </p>
        <p class="sm">your phone!</p>
        <p class="med">your ipad!</p>
        <p class="lg">your laptop!</p>
        <p class="xl">your computer!</p>

        <div id="card-container">
            <div>My Recent Vacations</div>
            <div>Future Plans</div>
            <div>Favorite Musicians</div>
            <div>Social Media</div>

        </div>

    </div>

</html>
